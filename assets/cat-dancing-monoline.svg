<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF9; }
      .cat-stroke {
        stroke: #5A1E5E;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .cat-stroke-inner {
        stroke: #5A1E5E;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .cat-fill-white {
        fill: #FFFFFF;
      }
      .cat-solid {
        fill: #5A1E5E;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="650" class="bg" rx="24" />

  <!-- Grid / subtle frame for presentation -->
  <rect x="20" y="20" width="460" height="610" rx="16" fill="none" stroke="#632568" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 6" />

  <!-- DANCING MONOLINE CAT -->
  <g id="dancing-cat" transform="translate(45, 20)">

    <!-- TAIL (Hangs on the left, graceful curve down & up at tip) -->
    <path class="cat-stroke" d="
      M 160 410 
      C 130 430, 95 470, 95 530 
      C 95 570, 115 595, 130 585 
      C 142 575, 140 545, 132 525 
      C 125 505, 125 475, 145 440
    " />

    <!-- TORSO & LOWER BODY (Plump belly on left, dancing legs below) -->
    <!-- Belly & Left Hind Leg (Straight standing leg) -->
    <path class="cat-stroke" d="
      M 195 240
      C 175 270, 160 320, 165 375
      C 170 420, 185 450, 195 475
      L 190 560
      C 190 575, 210 575, 212 560
      L 220 490
      C 230 480, 245 480, 255 490
      L 260 520
      C 265 540, 290 555, 305 535
      C 315 520, 310 495, 295 475
      C 320 445, 315 390, 305 345
    " />

    <!-- RIGHT HIND LEG KNEE ACCENT (Shows stepping dance fold) -->
    <path class="cat-stroke-inner" d="
      M 270 455
      C 290 460, 305 475, 300 495
    " />

    <!-- LOWER RIGHT OUTSTRETCHED ARM (Arm 2: reaching out to the right) -->
    <path class="cat-stroke" d="
      M 285 295
      C 310 295, 340 300, 370 305
      C 385 308, 395 320, 388 335
      C 382 345, 365 345, 350 338
      C 325 328, 305 325, 290 328
    " />

    <!-- UPPER RAISED ARM (Arm 1: High dancing pose curving over) -->
    <path class="cat-stroke" d="
      M 255 235
      C 275 210, 305 180, 335 160
      C 355 145, 375 140, 380 152
      C 385 165, 370 175, 350 185
      C 325 198, 295 225, 275 255
    " />

    <!-- HEAD & EARS (Tilted cute, seamlessly connected monoline) -->
    <path class="cat-stroke" d="
      M 175 220
      C 165 200, 160 175, 175 155
      L 165 110
      C 165 105, 175 105, 185 118
      L 210 145
      C 225 142, 245 144, 258 150
      L 282 122
      C 290 112, 300 115, 298 125
      L 285 168
      C 295 188, 290 215, 275 232
      C 255 250, 225 255, 198 245
      C 185 238, 178 230, 175 220
    " />

    <!-- INNER EAR / CREASE STROKE (Subtle minimalist detail like right reference) -->
    <path class="cat-stroke-inner" d="
      M 185 130
      C 192 145, 198 160, 200 170
    " />

    <!-- MINIMALIST FACE (Exact style of right reference: 2 dot eyes + inverted triangle nose) -->
    <!-- Left Eye -->
    <circle cx="205" cy="182" r="5.5" class="cat-solid" />
    <!-- Right Eye -->
    <circle cx="250" cy="188" r="5.5" class="cat-solid" />
    <!-- Inverted Triangle Nose -->
    <polygon points="228,198 221,208 235,208" class="cat-solid" />

    <!-- Chest / Neck fold line (like the subtle interior lines in monoline art) -->
    <path class="cat-stroke-inner" d="
      M 215 240
      C 230 250, 245 250, 260 242
    " />

  </g>

  <!-- Title & Style Annotation -->
  <text x="250" y="625" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#632568" letter-spacing="1">
    MÈO NHẢY MONOLINE — TƯ THẾ DANCING CAT • PHONG CÁCH TỐI GIẢN
  </text>
</svg>
