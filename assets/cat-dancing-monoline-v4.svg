<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 720" width="100%" height="100%">
  <defs>
    <style>
      .canvas-bg { fill: #FFFDF9; }
      .stroke-monoline {
        stroke: #522158;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .stroke-accent {
        stroke: #522158;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .stroke-whisker {
        stroke: #522158;
        stroke-width: 4.5;
        stroke-linecap: round;
        fill: none;
      }
      .solid-purple {
        fill: #522158;
      }
      .belly-fill {
        fill: #FFF9F1;
      }
      .body-white {
        fill: #FFFFFF;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="580" height="720" rx="32" class="canvas-bg" />
  <rect x="22" y="22" width="536" height="676" rx="22" fill="none" stroke="#632568" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="8 8" />

  <!-- DANCING CAT GROUP -->
  <g id="dancing-cat" transform="translate(45, 25)">

    <!-- 1. TAIL (Flows gracefully on the left side) -->
    <path class="stroke-monoline" d="
      M 162 425
      C 130 455, 96 495, 92 548
      C 88 590, 108 615, 126 605
      C 138 595, 136 565, 128 545
      C 120 520, 122 485, 142 455
    " />

    <!-- 2. SOFT CREAM BELLY SILHOUETTE (Subtle warm underlay) -->
    <path class="belly-fill" d="
      M 175 240
      C 145 285, 140 345, 148 405
      C 155 450, 175 480, 188 500
      C 220 495, 250 490, 270 470
      C 295 440, 305 390, 300 350
      C 290 300, 265 255, 235 242
      Z
    " />

    <!-- 3. LOWER ARM (Reaching right, bent elbow, drooping paw like ref 1) -->
    <path class="stroke-monoline" d="
      M 295 305
      C 320 302, 350 308, 375 320
      C 392 328, 402 342, 396 358
      C 390 372, 372 374, 360 362
      C 346 348, 328 340, 298 345
    " />

    <!-- 4. UPPER ARM (Dancing pose: arches high overhead towards the head) -->
    <path class="stroke-monoline" d="
      M 258 220
      C 280 185, 310 145, 340 115
      C 362 94, 388 88, 394 105
      C 400 122, 380 138, 358 155
      C 328 178, 292 215, 272 250
    " />

    <!-- Armpit connection to lower arm -->
    <path class="stroke-accent" d="
      M 272 250
      C 282 272, 290 290, 295 305
    " />

    <!-- 5. MAIN CONTINUOUS BODY (Seamless left jaw -> chest -> plump belly -> standing leg -> groin -> dancing leg -> hip -> waist) -->
    <path class="stroke-monoline" d="
      M 168 205
      C 162 225, 168 245, 174 260
      C 148 295, 140 350, 146 410
      C 152 460, 172 495, 182 518
      L 178 595
      C 178 610, 200 610, 202 595
      L 212 525
      C 225 512, 245 512, 258 522
      C 265 538, 278 565, 288 582
      C 298 596, 320 588, 322 570
      C 324 550, 312 522, 302 502
      C 326 470, 322 415, 312 375
      C 305 350, 298 345, 298 345
    " />

    <!-- 6. HEAD & EARS (Facing front-left, perky cute ears) -->
    <path class="stroke-monoline" d="
      M 168 205
      C 150 185, 148 152, 166 130
      L 158 78
      C 156 70, 170 70, 180 82
      L 208 116
      C 225 112, 248 112, 265 116
      L 290 85
      C 300 74, 314 76, 310 88
      L 298 135
      C 312 158, 308 190, 292 215
      C 278 230, 258 235, 238 232
    " />

    <!-- Ear interior line (Right image monoline style) -->
    <path class="stroke-accent" d="
      M 180 92
      C 188 112, 195 130, 198 142
    " />
    <path class="stroke-accent" d="
      M 296 98
      C 290 116, 284 134, 282 148
    " />

    <!-- 7. MINIMALIST FACE (Solid dot eyes + solid inverted triangle nose) -->
    <!-- Eyes: bold solid dots, expressive and friendly -->
    <circle cx="202" cy="165" r="6.5" class="solid-purple" />
    <circle cx="254" cy="170" r="6.5" class="solid-purple" />

    <!-- Inverted Triangle Nose -->
    <polygon points="228,178 220,190 236,190" class="solid-purple" />

    <!-- Whiskers (Minimal, 2 on each side like reference 1) -->
    <line x1="150" y1="172" x2="178" y2="176" class="stroke-whisker" />
    <line x1="148" y1="185" x2="176" y2="183" class="stroke-whisker" />
    <line x1="276" y1="178" x2="304" y2="175" class="stroke-whisker" />
    <line x1="274" y1="188" x2="302" y2="191" class="stroke-whisker" />

    <!-- 8. CHEST ACCENT (Connecting jaw to upper arm seamlessly) -->
    <path class="stroke-accent" d="
      M 238 232
      C 248 228, 254 224, 258 220
    " />

  </g>

  <!-- Title Caption -->
  <text x="290" y="685" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#632568" letter-spacing="0.5">
    PHÁC THẢO MÈO LÊ SƠN — DÁNG DANCING CAT • PHONG CÁCH MONOLINE TỐI GIẢN
  </text>
</svg>
